name: Release deadrop client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            archive-ext: tar.gz
            binary-ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            archive-ext: tar.gz
            binary-ext: ""
          - target: x86_64-apple-darwin
            os: macos-13
            use-cross: false
            archive-ext: tar.gz
            binary-ext: ""
          - target: aarch64-apple-darwin
            os: macos-14
            use-cross: false
            archive-ext: tar.gz
            binary-ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use-cross: false
            archive-ext: zip
            binary-ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build with cross (musl targets)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path client/Cargo.toml

      - name: Build with cargo
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path client/Cargo.toml

      - name: Package archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="deadrop${{ matrix.binary-ext }}"
          ARCHIVE="deadrop-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive-ext }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/${BIN}"
          tar -C dist -czf "$ARCHIVE" "$BIN"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "deadrop${{ matrix.binary-ext }}"
          $archive = "deadrop-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive-ext }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$bin" "dist/$bin"
          Compress-Archive -Path "dist/$bin" -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
